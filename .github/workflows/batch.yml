name: Walmart Batch ETL Pipeline

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *' # Todos los días a las 12:00 AM UTC
  workflow_dispatch: # Permite la ejecución manual desde la interfaz de GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Requerido para hacer push de los archivos modificados/generados

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java (requerido por PySpark)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: |
          python src/pipeline.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/silver/ data/gold/ reports/ docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Batch Update: Data Layers & Dashboard" && git push)
